<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Donation Update | Plane Pull Team Healthy Hikers</title>
    <link rel="stylesheet" href="/styles.css">
  </head>
  <body>
    <div class="app-shell warning-shell">
      <header class="site-header">
        <a class="brand" href="/" aria-label="Plane Pull Team Healthy Hikers home">
          <img src="/assets/hh-logo.png" alt="Healthy Hikers logo">
          <span>
            <strong>Plane Pull Team</strong>
            <em>Healthy Hikers</em>
          </span>
        </a>
        <nav class="top-actions" aria-label="Primary actions">
          <a class="ghost-button" href="/">Home</a>
          <a class="ghost-button" href="/competitors.html">Competitors</a>
        </nav>
      </header>

      <main>
        <section class="warning-card" aria-labelledby="warningTitle">
          <span class="warning-label">Donation Update</span>
          <h1 id="warningTitle">Before You Continue</h1>
          <p class="warning-message">
            We already reached our goal for the donation to Special Olympics, please consider donating to our <span class="no-break">T-shirt Fund</span> (PayPal/Zelle to zhihong@gmail.com).
          </p>
          <div class="warning-actions">
            <a class="link-button" href="https://impact.specialolympicsva.org/team/832142" target="_blank" rel="noreferrer">
              Continue to Special Olympics
            </a>
            <a class="ghost-button" href="/">
              Back to Home
            </a>
          </div>
        </section>
      </main>
    </div>
  </body>
</html>
